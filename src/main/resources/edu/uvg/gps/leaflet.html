<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1923; }
        #map { width: 100%; height: 100vh; }
        .popup-accidente { font-family: 'Segoe UI', sans-serif; font-size: 13px; min-width: 210px; }
        .popup-accidente h4 { margin: 0 0 10px; color: #e53935; font-size: 13px; font-weight: 600;
            border-bottom: 1px solid #fce4e4; padding-bottom: 6px; }
        .popup-accidente .coords { font-size: 10px; color: #999; margin-bottom: 8px; }
        .popup-accidente label { font-size: 11px; color: #666; display: block; margin-bottom: 4px; }
        .popup-accidente select { width: 100%; padding: 5px 8px; margin-bottom: 8px;
            border: 1px solid #dadce0; border-radius: 6px; font-size: 12px; background: #fff; }
        .popup-btn { width: 100%; padding: 7px; color: white; border: none; border-radius: 6px;
            cursor: pointer; font-size: 12px; font-weight: 600; margin-top: 4px; }
        .popup-btn:hover { opacity: 0.85; }
        .btn-reportar { background: #e53935; }
        .btn-limpiar  { background: #2e7d32; }
        .popup-fuera  { font-family: 'Segoe UI', sans-serif; font-size: 12px;
            color: #e53935; padding: 4px 0; }
        .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .leaflet-popup-tip { display: none; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    var map = L.map('map', { center: [14.58, -90.62], zoom: 11 });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    var marcadores     = {};
    var marcadoresTemp = {};
    var rutasLineas    = [];
    var rutaOptima     = null;
    var corredorLayers = {};
    var polylineCoords = [];
    var popupClick     = null;

    var DISTANCIA_MAX_CLICK = 0.003;

    function crearIcono(color, size, texto) {
        size = size || 12; texto = texto || '';
        return L.divIcon({
            className: '',
            html: '<div style="width:'+size+'px;height:'+size+'px;background:'+color+
                  ';border:2px solid rgba(255,255,255,0.85);border-radius:50%;'+
                  'box-shadow:0 0 8px '+color+'60;display:flex;align-items:center;'+
                  'justify-content:center;font-size:9px;font-weight:bold;color:#fff;">'+texto+'</div>',
            iconSize: [size,size], iconAnchor: [size/2,size/2]
        });
    }

    var iconos = {
        inicio:   crearIcono('#ef5350', 16),
        destino:  crearIcono('#66bb6a', 16),
        normal:   crearIcono('#4fc3f7', 12),
        problema: crearIcono('#ff9800', 16, '!'),
        temporal: crearIcono('#f44336', 18, '⚠')
    };

    function agregarMarcador(lat, lon, nombre, tipo) {
        var icono = iconos[tipo] || iconos.normal;
        var safeId = nombre.replace(/[^a-zA-Z0-9]/g,'_');
        var popup =
            '<div class="popup-accidente">' +
            '<h4>📍 ' + nombre + '</h4>' +
            '<label>Tipo de problema:</label>' +
            '<select id="sel_'+safeId+'">' +
            '<option value="Accidente">🚗 Accidente</option>' +
            '<option value="Tormenta">🌧 Tormenta</option>' +
            '<option value="Construccion">🚧 Construccion</option>' +
            '<option value="Parada policial">👮 Parada policial</option>' +
            '<option value="Manifestacion">✊ Manifestacion</option>' +
            '</select>' +
            '<button class="popup-btn btn-reportar" onclick="reportarDesdePopup(\''+safeId+'\',\''+nombre.replace(/'/g,"\\'")+'\')">⚠ Reportar problema</button>' +
            '<button class="popup-btn btn-limpiar"  onclick="limpiarDesdePopup(\''+nombre.replace(/'/g,"\\'")+'\')">✅ Limpiar</button>' +
            '</div>';
        var marker = L.marker([lat,lon], {icon: icono}).addTo(map);
        marker.bindPopup(popup, {maxWidth:240, closeButton:true});
        marcadores[nombre] = {marker:marker, tipo:tipo, tieneProblema:false};
    }

    function agregarMarcadorTemporal(lat, lon, nombre) {
        var marker = L.marker([lat,lon], {icon: iconos.temporal}).addTo(map);
        marker.bindTooltip(nombre, {permanent: false, direction: 'top',
            className: 'leaflet-tooltip'});
        marker.bindPopup(
            '<div class="popup-accidente">' +
            '<h4>' + nombre + '</h4>' +
            '<p class="coords">Accidente temporal reportado</p>' +
            '<button class="popup-btn btn-limpiar" onclick="limpiarTemporal()">✅ Limpiar accidente</button>' +
            '</div>', {maxWidth:220, closeButton:true});
        marcadoresTemp[nombre] = marker;
    }

    function limpiarTemporal() {
        map.closePopup();
        if (window.javaConnector) window.javaConnector.limpiarTodosLosProblemas();
    }

    function limpiarMarcadoresTemporales() {
        for (var n in marcadoresTemp) map.removeLayer(marcadoresTemp[n]);
        marcadoresTemp = {};
    }

    function cercaDeRuta(lat, lon) {
        for (var i = 0; i < polylineCoords.length; i++) {
            var seg = polylineCoords[i];
            var d = distPuntoSegmento(lat, lon,
                seg[0][0], seg[0][1], seg[1][0], seg[1][1]);
            if (d < DISTANCIA_MAX_CLICK) return true;
        }
        return false;
    }

    function distPuntoSegmento(px, py, ax, ay, bx, by) {
        var dx = bx-ax, dy = by-ay;
        if (dx===0 && dy===0) return Math.sqrt((px-ax)*(px-ax)+(py-ay)*(py-ay));
        var t = ((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
        t = Math.max(0, Math.min(1, t));
        var nx = ax+t*dx, ny = ay+t*dy;
        return Math.sqrt((px-nx)*(px-nx)+(py-ny)*(py-ny));
    }

    map.on('click', function(e) {
        var lat = e.latlng.lat, lon = e.latlng.lng;
        if (popupClick) { map.closePopup(popupClick); popupClick = null; }

        if (!cercaDeRuta(lat, lon)) {
            popupClick = L.popup({maxWidth:220, closeButton:true})
                .setLatLng(e.latlng)
                .setContent('<div class="popup-fuera">⚠ Haz click sobre una ruta para reportar un problema.</div>')
                .openOn(map);
            return;
        }

        var contenido =
            '<div class="popup-accidente">' +
            '<h4>🗺 Reportar problema aquí</h4>' +
            '<p class="coords">' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</p>' +
            '<label>Tipo de problema:</label>' +
            '<select id="sel_click">' +
            '<option value="Accidente">🚗 Accidente</option>' +
            '<option value="Tormenta">🌧 Tormenta</option>' +
            '<option value="Construccion">🚧 Construccion</option>' +
            '<option value="Parada policial">👮 Parada policial</option>' +
            '<option value="Manifestacion">✊ Manifestacion</option>' +
            '</select>' +
            '<button class="popup-btn btn-reportar" onclick="reportarClickLibre('+lat+','+lon+')">⚠ Reportar en esta zona</button>' +
            '</div>';

        popupClick = L.popup({maxWidth:250, closeButton:true})
            .setLatLng(e.latlng)
            .setContent(contenido)
            .openOn(map);
    });

    function reportarClickLibre(lat, lon) {
        var sel = document.getElementById('sel_click');
        var tipo = sel ? sel.value : 'Accidente';
        map.closePopup(popupClick); popupClick = null;
        if (window.javaConnector) {
            window.javaConnector.reportarAccidenteEnCoordenadas(lat, lon, tipo);
        }
    }

    function reportarDesdePopup(safeId, nombreCiudad) {
        var sel = document.getElementById('sel_'+safeId);
        var tipo = sel ? sel.value : 'Accidente';
        if (marcadores[nombreCiudad]) {
            marcadores[nombreCiudad].marker.setIcon(iconos.problema);
            marcadores[nombreCiudad].tieneProblema = true;
        }
        if (window.javaConnector) window.javaConnector.reportarProblema(nombreCiudad, tipo);
    }

    function limpiarDesdePopup(nombreCiudad) {
        if (marcadores[nombreCiudad]) {
            marcadores[nombreCiudad].marker.setIcon(
                iconos[marcadores[nombreCiudad].tipo] || iconos.normal);
            marcadores[nombreCiudad].tieneProblema = false;
        }
        if (window.javaConnector) window.javaConnector.limpiarProblema(nombreCiudad);
    }

    function limpiarIconosProblemas() {
        for (var n in marcadores) {
            if (marcadores[n].tieneProblema) {
                marcadores[n].marker.setIcon(
                    iconos[marcadores[n].tipo] || iconos.normal);
                marcadores[n].tieneProblema = false;
            }
        }
        limpiarMarcadoresTemporales();
    }

    function dibujarRutaAzul(coordsJson) {
        var coords = JSON.parse(coordsJson);
        var linea = L.polyline(coords,
            {color:'#4fc3f7', weight:2, opacity:0.5, dashArray:'4 4'}).addTo(map);
        rutasLineas.push(linea);
        if (coords.length >= 2)
            polylineCoords.push([coords[0], coords[coords.length-1]]);
    }

    function dibujarCorredor(indice, coordsJson, color) {
        if (corredorLayers[indice] && map.hasLayer(corredorLayers[indice]))
            map.removeLayer(corredorLayers[indice]);
        var coords = JSON.parse(coordsJson);
        var poly = L.polyline(coords, {color:color, weight:5, opacity:0.85});
        corredorLayers[indice] = poly;
        for (var i = 0; i < coords.length-1; i++)
            polylineCoords.push([coords[i], coords[i+1]]);
        if (!rutaOptima) poly.addTo(map);
    }

    function ocultarCorredores() {
        for (var idx in corredorLayers)
            if (map.hasLayer(corredorLayers[idx])) map.removeLayer(corredorLayers[idx]);
    }

    function mostrarCorredores() {
        for (var idx in corredorLayers)
            if (!map.hasLayer(corredorLayers[idx])) corredorLayers[idx].addTo(map);
    }

    function mostrarSoloCorredor(indice) {
        if (rutaOptima) { map.removeLayer(rutaOptima); rutaOptima = null; }
        ocultarCorredores();
        if (indice < 0) {
            mostrarCorredores();
        } else if (corredorLayers[indice]) {
            corredorLayers[indice].addTo(map);
            map.fitBounds(corredorLayers[indice].getBounds(), {padding:[40,40]});
        }
    }

    function dibujarRutaOptima(coordsJson) {
        if (rutaOptima) { map.removeLayer(rutaOptima); rutaOptima = null; }
        ocultarCorredores();
        rutaOptima = L.polyline(JSON.parse(coordsJson),
            {color:'#00e676', weight:7, opacity:0.95}).addTo(map);
        map.fitBounds(rutaOptima.getBounds(), {padding:[40,40]});
    }

    function dibujarPolyline(coordsJson) { dibujarRutaOptima(coordsJson); }

    function limpiarRuta() {
        if (rutaOptima) { map.removeLayer(rutaOptima); rutaOptima = null; }
        mostrarCorredores();
    }

    function limpiarTodo() {
        rutasLineas.forEach(function(l){ map.removeLayer(l); });
        rutasLineas = []; polylineCoords = [];
        limpiarRuta();
    }

    function ajustarVista() {
        var puntos = [];
        for (var n in marcadores) puntos.push(marcadores[n].marker.getLatLng());
        if (puntos.length > 0) map.fitBounds(L.latLngBounds(puntos), {padding:[40,40]});
    }

    var capaNodos = L.layerGroup().addTo(map);

    function agregarNodoIntermedio(lat, lon, nombre) {
        var icono = crearIcono('#4fc3f7', 8, '');
        var marker = L.circleMarker([lat, lon], {
            radius: 4, color: '#4fc3f7', fillColor: '#4fc3f7',
            fillOpacity: 0.8, weight: 1
        });
        marker.bindTooltip(nombre, {permanent: false, direction: 'top'});
        capaNodos.addLayer(marker);
    }

    function limpiarNodos() {
        capaNodos.clearLayers();
    }

    var lineaCamino = null;

    function dibujarCaminoBusqueda(coordsJson) {
        if (lineaCamino) { map.removeLayer(lineaCamino); lineaCamino = null; }
        lineaCamino = L.polyline(JSON.parse(coordsJson), {
            color: '#ce93d8', weight: 6, opacity: 0.9, dashArray: '8 4'
        }).addTo(map);
        map.fitBounds(lineaCamino.getBounds(), {padding:[40,40]});
    }

    function limpiarCaminoBusqueda() {
        if (lineaCamino) { map.removeLayer(lineaCamino); lineaCamino = null; }
    }
</script>
</body>
</html>
